<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer 360 Persona — NICL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2c5c; --navy2:#145da0; --navy3:#1e7fd8; --gold:#c9971c;
  --bg:#f5f7fa; --card:#ffffff; --border:#dde3ea; --text:#16212f; --muted:#5c6b7a;
  --good:#1e7e46; --warn:#b8860b; --bad:#b0311f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1420; --card:#101b2b; --border:#2c3a4d; --text:#e7ecf2; --muted:#8b98a8; } }
:root[data-theme="dark"]{ --bg:#0b1420; --card:#101b2b; --border:#2c3a4d; --text:#e7ecf2; --muted:#8b98a8; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,sans-serif;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px;}
.topbanner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,#0a2c5c,#0d3868);border-radius:14px;padding:12px 18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(10,44,92,.18);}
.brand-group{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0e9488,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:0 0 auto;}
.brand-divider{width:1px;height:26px;background:rgba(255,255,255,.25);flex:0 0 auto;}
.brand-title{font-weight:700;font-size:15px;color:#fff;white-space:nowrap;}
.brand-title span{color:#5fd4e8;margin-left:5px;}
select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;min-width:220px;}

.header{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 24px;background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 65%,var(--navy3) 130%);border-radius:14px;color:#eef2f7;margin-bottom:14px;box-shadow:0 6px 20px rgba(10,44,92,.18);}
.header h1{margin:0 0 5px;font-size:21px;font-weight:700;letter-spacing:-.2px;}
.header .sub{opacity:.85;font-size:12px;}
.header .title{font-size:10.5px;text-transform:uppercase;letter-spacing:1.6px;opacity:.7;margin-bottom:6px;font-weight:600;color:#cfe0f5;}
.score-badge{text-align:center;background:rgba(255,255,255,.10);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 22px;min-width:110px;flex:0 0 auto;}
.score-badge .num{font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.score-badge .lbl{font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.score-badge .band{display:inline-block;margin-top:5px;font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:700;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(10,44,92,.04);}
.stat .v{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.stat .l{font-size:9.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}

.section{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(10,44,92,.04),0 2px 8px rgba(10,44,92,.05);}
.section h2{margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--navy2);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;}
.pill.good{background:rgba(30,126,70,.12);color:var(--good);}
.pill.warn{background:rgba(184,134,11,.14);color:var(--warn);}
.pill.bad{background:rgba(176,49,31,.12);color:var(--bad);}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px;}
.bar-row .lbl{width:66px;color:var(--muted);flex:0 0 auto;}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:9px;overflow:hidden;border:1px solid var(--border);}
.bar-fill{height:100%;background:var(--gold);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:760px){.two-col{grid-template-columns:1fr}}
.mini{font-size:12.5px;margin:5px 0;color:var(--text);}
.mini .lbl{color:var(--muted);}

.timeline{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;}
.t-node{flex:0 0 auto;min-width:104px;border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center;position:relative;}
.t-node.active{border-color:var(--good);background:rgba(30,126,70,.08);}
.t-node.claim::after{content:"⚠";position:absolute;top:4px;right:6px;font-size:10px;color:var(--bad);}
.t-node .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.t-node .yr{font-weight:700;font-size:12.5px;}
.t-node .pr{font-size:10.5px;color:var(--muted);margin-top:2px;}

.insights{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
@media(max-width:900px){.insights{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.insights{grid-template-columns:1fr}}
.insight-card{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg);}
.insight-card h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);}
.insight-card p{margin:0;font-size:12px;line-height:1.5;color:var(--text);}

.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;border:1px solid transparent;}
.tag.pos{background:rgba(30,126,70,.10);color:var(--good);border-color:rgba(30,126,70,.25);}
.tag.neg{background:rgba(176,49,31,.10);color:var(--bad);border-color:rgba(176,49,31,.25);}

.score-badge{cursor:pointer;transition:transform .1s;}
.score-badge:hover{transform:translateY(-1px);}
.score-badge .hint{font-size:9px;opacity:.6;margin-top:4px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,16,26,.55);z-index:50;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--card);border-radius:14px;max-width:420px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box h3{margin:0 0 2px;font-size:15px;}
.modal-box .modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.modal-score-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.modal-score-row .num{font-size:30px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.modal-close{float:right;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;}

.search-bar-row{display:flex;justify-content:center;margin:18px 0 22px;}
.search-wrap{display:flex;gap:6px;width:100%;max-width:460px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:5px;box-shadow:0 4px 16px rgba(10,44,92,.08);}
.search-wrap input{flex:1;background:transparent;border:none;color:var(--text);padding:10px 16px;font-size:13.5px;outline:none;}
.search-wrap button{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border:none;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;}
.search-wrap button:hover{filter:brightness(1.08);}
.home-search{display:flex;gap:6px;max-width:480px;margin:0 auto 30px;background:var(--card);border:1px solid var(--border);border-radius:32px;padding:6px;box-shadow:0 8px 26px rgba(10,44,92,.10);}
.home-search input{flex:1;background:transparent;border:none;color:var(--text);padding:12px 18px;font-size:14.5px;outline:none;}
.home-search button{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border:none;padding:12px 26px;border-radius:26px;font-size:14px;font-weight:600;cursor:pointer;}
.home-search button:hover{filter:brightness(1.08);}
.search-wrap input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;}
.search-wrap button{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.search-wrap button:hover{background:var(--navy2);}
.home-wrap{text-align:center;padding:10px 20px 40px;}
.home-accent{width:44px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--navy3));margin:0 auto 22px;}
.home-wrap h1{font-size:34px;margin:0 0 10px;color:var(--navy);font-weight:800;letter-spacing:-.6px;}
.home-wrap p{color:var(--muted);font-size:14.5px;margin:0 0 36px;max-width:440px;margin-left:auto;margin-right:auto;line-height:1.55;}
.chip-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.chip{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:7px 15px;font-size:12px;cursor:pointer;}
.chip:hover{border-color:var(--navy3);color:var(--navy3);}
.match-list{max-width:460px;margin:0 auto;}
.match-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;text-align:left;cursor:pointer;}
.match-item:hover{border-color:var(--gold);}
.match-item .mid{color:var(--muted);font-size:11.5px;}
.back-link{display:inline-block;margin-bottom:12px;font-size:12.5px;color:var(--navy2);cursor:pointer;text-decoration:underline;}
:root[data-theme="dark"] .back-link,:root:not([data-theme="light"]) .back-link{color:#9fc2ec}

.login-overlay{position:fixed;inset:0;background:linear-gradient(120deg,#0a2c5c,#0d3868);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.login-overlay.hidden{display:none;}
.login-box{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.login-box h2{margin:0 0 4px;font-size:18px;color:var(--text);}
.login-box p{margin:0 0 18px;font-size:12.5px;color:var(--muted);}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;}
.login-box input,.login-box select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13.5px;}
.login-box button{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.login-err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px;}
.user-chip{display:flex;align-items:center;gap:10px;color:#fff;font-size:12.5px;}
.user-chip .role{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:12px;font-weight:600;}
.user-chip button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
.access-note{text-align:center;font-size:11.5px;color:var(--muted);margin:-12px 0 16px;}
.search-wrap{position:relative;}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(10,44,92,.18);z-index:50;overflow:hidden;display:none;text-align:left;}
.sugg.open{display:block;}
.sugg-item{padding:9px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--text);}
.sg-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.sg-main b{font-weight:600;}
.sg-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
.sugg-item{align-items:center;}
.sugg-item small{color:var(--muted);font-size:11.5px;white-space:nowrap;}
.sugg-item:hover,.sugg-item.active{background:rgba(10,44,92,.08);}
.sugg-empty{padding:10px 16px;font-size:12.5px;color:var(--muted);}
.details-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:14px 0;}
.dc-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;}
.dc-tag{background:rgba(10,44,92,.1);color:var(--navy3);padding:3px 10px;border-radius:12px;font-size:11px;letter-spacing:0;text-transform:none;}
.dc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;}
.dc-l{font-size:11px;color:var(--muted);margin-bottom:2px;}
.dc-v{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-all;}
.search-page{display:flex;justify-content:center;margin:22px 0 10px;}
.sp-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px;width:100%;max-width:560px;box-shadow:0 4px 16px rgba(10,44,92,.08);}
.sp-title{margin:0 0 4px;font-size:22px;color:var(--text);}
.sp-sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);}
.sp-field{position:relative;margin-bottom:14px;}
.sp-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.sp-field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;}
.sp-field input:focus{outline:2px solid rgba(10,44,92,.25);}
.sp-actions{display:flex;gap:10px;margin-top:6px;}
.sp-go{flex:1;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.sp-clear{background:transparent;border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:8px;font-size:13px;cursor:pointer;}
.two-col{display:block !important;}
.top-row{display:grid;grid-template-columns:1fr 230px;gap:14px;margin:14px 0;align-items:stretch;}
.top-row .details-card{margin:0;}
.dc-sub{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}
.score-card{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:12px;padding:16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-card:hover{transform:translateY(-1px);}
.sc-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;opacity:.8;}
.sc-num{font-size:44px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1.1;margin:4px 0;}
.sc-hint{font-size:10.5px;opacity:.65;margin-top:8px;}
.acc-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:6px 2px 8px;}
.acc-bar a{text-transform:none;letter-spacing:0;font-weight:500;color:var(--navy2);cursor:pointer;text-decoration:underline;}
details.acc{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;margin-bottom:10px;overflow:hidden;}
details.acc>summary{cursor:pointer;list-style:none;padding:13px 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--navy2);display:flex;justify-content:space-between;align-items:center;}
details.acc>summary::-webkit-details-marker{display:none;}
details.acc>summary::after{content:'+';font-size:18px;font-weight:400;color:var(--muted);}
details.acc[open]>summary::after{content:'\2212';}
details.acc[open]>summary{border-bottom:1px solid var(--border);}
.acc-body{padding:14px 18px;}
@media(max-width:640px){.top-row{grid-template-columns:1fr;}.insights{grid-template-columns:1fr 1fr !important;}}
.sp-card{max-width:100% !important;padding:20px 24px !important;}
.sp-title{font-size:19px !important;}
.sp-sub{margin-bottom:14px !important;}
.sp-row{display:flex;gap:14px;align-items:flex-end;}
.sp-fields{display:flex;gap:14px;flex:1;min-width:0;}
.sp-field{flex:1;min-width:0;margin-bottom:0 !important;}
.sp-actions{margin-top:0 !important;flex:none;}
.sp-go{flex:none !important;padding:11px 26px !important;}
.stats{grid-template-columns:repeat(10,minmax(0,1fr)) !important;gap:6px !important;}
.stat{padding:10px 3px !important;}
.stat .v{font-size:clamp(10px,1.2vw,14px) !important;white-space:nowrap;}
.stat .l{font-size:8.5px !important;letter-spacing:0 !important;}
@media(max-width:900px){.stats{grid-template-columns:repeat(5,minmax(0,1fr)) !important;}}
@media(max-width:700px){.sp-row,.sp-fields{flex-direction:column;align-items:stretch;}.sp-fields{gap:12px;}}
.dc-v{word-break:normal !important;overflow-wrap:break-word;}
.dc-grid{grid-template-columns:1.4fr 1.4fr 1fr !important;}
.score-card .band{background:rgba(255,255,255,.92) !important;}
@media(max-width:700px){.dc-grid{grid-template-columns:1fr !important;}}
/* ---- compact one-screen layout, bold professional headings ---- */
.wrap{padding:12px 20px 24px !important;}
.topbanner{margin-bottom:10px !important;padding:9px 16px !important;}
.search-page{margin:0 0 10px !important;}
.sp-card{padding:12px 18px 14px !important;border-radius:12px !important;}
.sp-title{font-size:15px !important;font-weight:800 !important;letter-spacing:.9px;text-transform:uppercase;color:var(--navy2) !important;margin:0 0 9px !important;}
.sp-sub{display:none !important;}
.sp-field label{font-size:11px !important;font-weight:700 !important;letter-spacing:.3px;margin-bottom:3px !important;color:var(--text) !important;}
.sp-field input{padding:8px 12px !important;font-size:13.5px !important;}
.sp-go{padding:9px 24px !important;}.sp-clear{padding:9px 16px !important;}
.top-row{margin:0 0 10px !important;gap:10px !important;grid-template-columns:1fr 200px !important;}
.details-card{padding:10px 16px !important;border-radius:12px !important;}
.dc-head{font-size:13px !important;font-weight:800 !important;letter-spacing:.9px !important;color:var(--navy2) !important;margin-bottom:7px !important;}
.dc-l{font-size:10.5px !important;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.dc-v{font-size:14px !important;font-weight:700 !important;}
.dc-sub{margin-top:7px !important;padding-top:7px !important;font-size:11.5px !important;}
.score-card{padding:8px 12px !important;border-radius:12px !important;}
.sc-title{font-size:11px !important;font-weight:800;letter-spacing:1.2px !important;}
.sc-num{font-size:34px !important;margin:0 !important;}
.sc-hint{margin-top:5px !important;font-size:10px !important;}
.stats{margin-bottom:10px !important;}
.stat{padding:8px 3px !important;}
.sec-head{font-size:13px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--navy2);margin:2px 2px 7px;}
.acc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start;}
details.acc{margin-bottom:0 !important;border-radius:10px !important;}
details.acc[open]{grid-column:1 / -1;}
details.acc>summary{padding:10px 14px !important;font-size:12px !important;font-weight:800 !important;letter-spacing:.7px !important;}
@media(max-width:900px){.acc-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:600px){.acc-grid{grid-template-columns:1fr;}.top-row{grid-template-columns:1fr !important;}}
details.acc[open] .acc-body{max-height:max(150px,calc(100vh - 520px));overflow-y:auto;}
.sec-head{display:flex;justify-content:space-between;align-items:center;}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.view-toggle button{background:var(--card);border:none;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);cursor:pointer;text-transform:none;}
.view-toggle button.on{background:var(--navy2);color:#fff;}
.lp{display:none;grid-template-columns:230px 1fr;gap:10px;height:calc(100vh - 445px);min-height:370px;}
body.mode-lp .lp{display:grid;}
body.mode-lp .acc-grid{display:none;}
body.mode-lp .wrap{max-width:1280px;}
.lp-nav{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;overflow-y:auto;}
.lp-item{padding:8px 12px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--navy2);border-left:4px solid transparent;border-radius:6px;cursor:pointer;}
.lp-item:hover{background:rgba(10,44,92,.06);}
.lp-item.active{background:rgba(10,44,92,.09);border-left-color:var(--gold);}
.lp-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.lp-title{padding:11px 18px;font-size:13px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--navy2);border-bottom:1px solid var(--border);}
.lp-body{padding:14px 18px;overflow-y:auto;flex:1;}
@media(max-width:800px){.lp{grid-template-columns:1fr;height:auto;}.lp-nav{display:flex;flex-wrap:wrap;gap:4px;}}
.acc-body h2,.lp-body h2{margin:16px 0 8px !important;padding-bottom:6px;font-size:11.5px !important;font-weight:800 !important;letter-spacing:.9px;text-transform:uppercase;color:var(--navy2);border-bottom:1px solid var(--border);}
.acc-body h2:first-child,.lp-body h2:first-child{margin-top:0 !important;}
/* ---- logo ---- */
.brand-logo{height:38px;width:auto;border-radius:5px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.login-logo{background:#08365a;margin:-28px -28px 18px;padding:16px 28px;border-radius:16px 16px 0 0;text-align:center;}
.login-logo img{height:56px;width:auto;border-radius:6px;}
/* ---- left panel: final design ---- */
.sec-head .view-toggle{display:none;}
.lp{display:grid !important;grid-template-columns:262px 1fr !important;gap:12px !important;height:calc(100vh - 452px) !important;min-height:380px !important;}
.acc-grid{display:none !important;}
.wrap{max-width:1280px !important;}
.lp-nav{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;overflow-y:auto;box-shadow:0 2px 10px rgba(10,44,92,.06);}
.lp-item{display:flex;align-items:center;gap:10px;padding:7px 10px !important;margin-bottom:2px;border-radius:10px !important;border-left:none !important;font-size:12px !important;font-weight:700 !important;letter-spacing:.2px !important;text-transform:none !important;color:var(--text) !important;cursor:pointer;transition:background .12s;}
.lp-item:hover{background:rgba(10,44,92,.06);}
.lp-ic{width:28px;height:28px;border-radius:8px;background:rgba(10,44,92,.09);color:var(--navy2);display:inline-flex;align-items:center;justify-content:center;flex:none;}
.lp-ic.on{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;margin-right:10px;}
.lp-tx{flex:1;line-height:1.2;}
.lp-bd{font-size:10.5px;font-weight:800;background:rgba(10,44,92,.1);color:var(--navy2);padding:2px 8px;border-radius:20px;}
.lp-bd.warn{background:rgba(176,49,31,.14);color:var(--bad);}
.lp-item.active{background:linear-gradient(90deg,rgba(10,44,92,.13),rgba(10,44,92,.03)) !important;box-shadow:inset 3px 0 0 var(--gold);}
.lp-item.active .lp-ic{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;}
.lp-item.active .lp-tx{color:var(--navy2);font-weight:800;}
.lp-panel{border-radius:14px !important;box-shadow:0 2px 10px rgba(10,44,92,.06);}
.lp-title{display:flex !important;align-items:center;padding:12px 18px !important;font-size:14px !important;font-weight:800 !important;background:linear-gradient(90deg,rgba(10,44,92,.08),rgba(10,44,92,0));}
.lp-body{padding:16px 20px !important;}
.lp-body .mini{display:flex;justify-content:space-between;align-items:center;gap:14px;max-width:520px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 14px;margin:0 0 7px;font-size:12.5px;}
.lp-body table{border:1px solid var(--border);border-radius:10px;overflow:hidden;border-collapse:separate;border-spacing:0;margin-top:10px;}
.lp-body th{background:rgba(10,44,92,.07);color:var(--navy2);padding:9px 12px;font-weight:800;position:sticky;top:0;}
.lp-body td{padding:9px 12px;}
.lp-body tbody tr:nth-child(even) td{background:rgba(10,44,92,.025);}
.lp-body .insights{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}
.lp-body .insight-card{box-shadow:0 1px 4px rgba(10,44,92,.07);border-radius:12px;padding:14px;}
.lp-body .bar-row{margin-bottom:4px;}
.lp-body h2{margin:18px 0 10px !important;}
@media(max-width:800px){.lp{grid-template-columns:1fr !important;height:auto !important;}.lp-nav{display:flex;flex-wrap:wrap;gap:4px;}.lp-body .insights{grid-template-columns:1fr !important;}}
.brand-logo{height:46px !important;}
.topbanner{padding:7px 16px !important;}
.lp{height:calc(100vh - 438px) !important;}
.lp-item{padding:4px 8px !important;margin-bottom:1px !important;}
.lp-ic{width:26px;height:26px;}
.lp-nav{padding:6px !important;}
</style>
</head>

function statusPill(s){
  const map={active:'good',expired:'warn',lapsed:'bad',Settled:'good',Rejected:'bad',Open:'warn'};
  return `<span class="pill ${map[s]||'warn'}">${s}</span>`;
}
function reasonPill(r){
  return /cheque dishonour/i.test(r) ? `<span class="pill bad">${r}</span>` : `<span class="pill warn">${r}</span>`;
}

function computeScore(d){
  const lobs = Object.keys(d.lobMix);
  const flags = {
    continuousRenewal: d.renewal.consecutive >= 3,
    promptRenewal: d.renewal.pattern === 'On-time',
    techSavvy: d.channel.startsWith('Online'),
    multiLOB: lobs.length > 1,
    chequeDishonour: d.endorsements.some(e=>/cheque dishonour/i.test(e.reason)),
    highEndorsementFreq: d.endorsements.length > d.policies.length * 0.3,
  };
  let score = 0;
  const tags = [];
  if (flags.continuousRenewal){ score+=30; tags.push(['pos','+30 Continuous renewal']); }
  if (flags.promptRenewal){ score+=20; tags.push(['pos','+20 Prompt renewal, no gap']); }
  if (flags.techSavvy){ score+=10; tags.push(['pos','+10 Tech-savvy / online']); }
  if (flags.multiLOB){ score+=15; tags.push(['pos','+15 Multi-LOB holder']); }
  if (flags.chequeDishonour){ score-=25; tags.push(['neg','-25 Cheque dishonour']); }
  if (flags.highEndorsementFreq){ score-=15; tags.push(['neg','-15 High endorsement frequency']); }
  score = Math.max(0, Math.min(100, score));
  const band = score>60 ? ['good','Valuable Customer'] : score>=30 ? ['warn','Standard Customer'] : ['bad','At-Risk Customer'];
  return {score, band, tags};
}

function inScope(k){
  if(!currentUser) return false;
  const o = currentUser.office, t = currentUser.role, c = CUST_OFFICE[k];
  if(t==="HO") return true;
  if(t==="RO") return c===o || (OFFICES[c]&&OFFICES[c].parent===o);
  return c===o;
}
let currentUser = null;
function can(field){ return currentUser && ROLES[currentUser.role].fields.includes(field); }
function doLogin(){
  const id = document.getElementById('empId').value.trim().toUpperCase();
  const pwd = document.getElementById('empPwd').value.trim();
  const u = EMP[id];
  if(!u){ document.getElementById('loginErr').textContent='Employee ID not found in employee master.'; return; }
  if(u.pwd !== pwd){ document.getElementById('loginErr').textContent='Wrong password. Demo password is demo123.'; return; }

  currentUser = {id, office:u.office, officeName:off.name, role:off.type};
  document.getElementById('loginErr').textContent='';
  document.getElementById('empPwd').value='';
  document.getElementById('loginOverlay').classList.add('hidden');
  applyRoleUI();
  renderHome();
}

const FIELD_META = { name:{label:'Full Name',ph:'Enter full name'}, email:{label:'Email',ph:'Enter email address'}, pan:{label:'PAN Number',ph:'Enter PAN number'} };

function selectCustomer(key){
  document.getElementById('home').innerHTML='';
  render(key);

/* ===== SEARCH + AUTO-SUGGEST ===== */
function findMatches(vals){
  const seen=new Set();
  const act=Object.keys(vals).filter(f=>can(f) && vals[f] && vals[f].trim());
  if(!act.length) return [];
  return Object.keys(DATA).filter(k => inScope(k) && act.every(f => (DATA[k][f]||'').toLowerCase().includes(vals[f].trim().replace(/\s+/g,' ').toLowerCase())))
    .filter(k => { const sig=DATA[k].name+'|'+DATA[k].email+'|'+DATA[k].pan; if(seen.has(sig)) return false; seen.add(sig); return true; });
}
let suggIdx=-1, suggVals=[], suggField='';
function showSugg(field){
  const q=document.getElementById('f_'+field).value.trim();
  hideSugg();
  if(!currentUser || q.length<2) return;
  const el=document.getElementById('sugg_'+field);
  const vals=[...new Set(findMatches({[field]:q}).map(k=>DATA[k][field]).filter(Boolean))].slice(0,6);
  suggVals=vals; suggField=field; suggIdx=-1;
  el.innerHTML = vals.length ? vals.map((v,i)=>`<div class="sugg-item" onmousedown="pickSugg(${i})"><span>${v}</span></div>`).join('')
                             : '<div class="sugg-empty">No matching value in your office scope</div>';
  el.classList.add('open');
}
function hideSugg(){ document.querySelectorAll('.sugg').forEach(e=>e.classList.remove('open')); suggIdx=-1; }
function pickSugg(i){
  document.getElementById('f_'+suggField).value = suggVals[i];
  hideSugg();
}
function suggKey(e,field){
  const items=document.querySelectorAll('#sugg_'+field+' .sugg-item');
  if(e.key==='ArrowDown'&&items.length){ e.preventDefault(); suggIdx=(suggIdx+1)%items.length; }
  else if(e.key==='ArrowUp'&&items.length){ e.preventDefault(); suggIdx=(suggIdx-1+items.length)%items.length; }
  else if(e.key==='Escape'){ hideSugg(); return; }
  else if(e.key==='Enter'){ if(suggIdx>=0){ e.preventDefault(); pickSugg(suggIdx); } else { hideSugg(); doSearch(); } return; }
  else return;
  items.forEach((n,i)=>n.classList.toggle('active',i===suggIdx));
}
function doSearch(){
  if(!currentUser) return;
  const vals={};
  ROLES[currentUser.role].fields.forEach(f=>{ vals[f]=document.getElementById('f_'+f).value; });
  if(!Object.values(vals).some(v=>v.trim())){ renderHome('Enter at least one search value.'); return; }
  const matches = findMatches(vals);
  if(matches.length === 1){
    selectCustomer(matches[0]);
  } else if(matches.length > 1){
    document.getElementById('content').innerHTML = '';
    document.getElementById('home').innerHTML = `
      <div class="home-wrap">
        <h1>Multiple matches</h1>
        <p>Select the customer you meant:</p>
        <div class="match-list">
          ${matches.map(k=>`<div class="match-item" onclick="selectCustomer('${k}')"><b>${DATA[k].name}</b><div class="mid">${shownContact(DATA[k]).email} &middot; ${shownContact(DATA[k]).pan}</div></div>`).join('')}
        </div>
      </div>`;
  } else {
    renderHome('No customer found for the details entered. Try a different search.');
  }
}

}
